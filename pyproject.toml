[project]
name = "saa-agents"
version = "0.1.0"
description = "LangGraph 기반 전략적 자산배분 멀티에이전트 파이프라인"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["saa*"]
